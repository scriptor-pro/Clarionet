<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBF7EF"/>
      <stop offset="100%" stop-color="#F0E6D2"/>
    </linearGradient>

    <linearGradient id="panel4" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#EADFC8"/>
      <stop offset="100%" stop-color="#D9C9A8"/>
    </linearGradient>

    <!-- corps du poste : orange chaud, signature Clarionet -->
    <linearGradient id="bodyOrange" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FF9D5C"/>
      <stop offset="45%" stop-color="#F2723A"/>
      <stop offset="100%" stop-color="#C9481B"/>
    </linearGradient>

    <linearGradient id="handleMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E9ECEE"/>
      <stop offset="100%" stop-color="#9AA1A7"/>
    </linearGradient>

    <radialGradient id="speakerGrille" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#FFF3E4"/>
      <stop offset="60%" stop-color="#F0DFC4"/>
      <stop offset="100%" stop-color="#D8C29C"/>
    </radialGradient>

    <linearGradient id="knob" x1="15%" y1="10%" x2="90%" y2="95%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E9ECEE"/>
      <stop offset="100%" stop-color="#8B939A"/>
    </linearGradient>

    <radialGradient id="ledGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B6FF3C" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#B6FF3C" stop-opacity="0"/>
    </radialGradient>

    <filter id="softShadow4" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="blur"/>
      <feOffset in="blur" dx="0" dy="10" result="offsetBlur"/>
      <feFlood flood-color="#5C4620" flood-opacity="0.3" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg4)"/>
  <rect x="46" y="46" width="932" height="932" rx="200" fill="url(#panel4)"/>
  <rect x="46" y="46" width="932" height="932" rx="200" fill="none" stroke="#C4A96F" stroke-width="4" opacity="0.5"/>

  <g filter="url(#softShadow4)">
    <!-- poignée arquée -->
    <path d="M 362 288 A 150 150 0 0 1 662 288" fill="none" stroke="url(#handleMetal)" stroke-width="34" stroke-linecap="round"/>

    <!-- corps du poste, rectangle large arrondi -->
    <rect x="182" y="270" width="660" height="500" rx="64" fill="url(#bodyOrange)"/>
    <rect x="182" y="270" width="660" height="500" rx="64" fill="none" stroke="#9C3A14" stroke-width="4" opacity="0.35"/>

    <!-- grille du haut-parleur, large cercle central -->
    <circle cx="512" cy="540" r="188" fill="url(#speakerGrille)"/>
    <circle cx="512" cy="540" r="188" fill="none" stroke="#B99B62" stroke-width="5" opacity="0.5"/>

    <!-- perforations de la grille, quinconce dense, fort contraste -->
    <g fill="#5A4322">
      <circle cx="440" cy="429" r="14"/>
      <circle cx="502" cy="429" r="14"/>
      <circle cx="564" cy="429" r="14"/>
      <circle cx="409" cy="483" r="14"/>
      <circle cx="471" cy="483" r="14"/>
      <circle cx="533" cy="483" r="14"/>
      <circle cx="595" cy="483" r="14"/>
      <circle cx="378" cy="537" r="14"/>
      <circle cx="440" cy="537" r="14"/>
      <circle cx="502" cy="537" r="14"/>
      <circle cx="564" cy="537" r="14"/>
      <circle cx="626" cy="537" r="14"/>
      <circle cx="409" cy="591" r="14"/>
      <circle cx="471" cy="591" r="14"/>
      <circle cx="533" cy="591" r="14"/>
      <circle cx="595" cy="591" r="14"/>
      <circle cx="440" cy="645" r="14"/>
      <circle cx="502" cy="645" r="14"/>
      <circle cx="564" cy="645" r="14"/>
    </g>

    <!-- deux molettes en bas de la façade -->
    <circle cx="270" cy="712" r="42" fill="url(#knob)"/>
    <circle cx="270" cy="712" r="42" fill="none" stroke="#6C7278" stroke-width="3" opacity="0.5"/>
    <circle cx="754" cy="712" r="42" fill="url(#knob)"/>
    <circle cx="754" cy="712" r="42" fill="none" stroke="#6C7278" stroke-width="3" opacity="0.5"/>

    <!-- petits repères sur les molettes -->
    <rect x="264" y="676" width="12" height="24" rx="5" fill="#6C7278" opacity="0.7"/>

    <!-- molette de droite : repère vert acide, radio allumée -->
    <circle cx="754" cy="688" r="26" fill="url(#ledGlow)"/>
    <rect x="748" y="676" width="12" height="24" rx="5" fill="#8CFF1E"/>
  </g>
</svg>
