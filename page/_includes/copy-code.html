<script>
  // Bouton « copier » sur chaque bloc de commandes d'installation.
  // Exécuté avant DOMContentLoaded pour que setLanguage() masque aussi
  // les libellés fr/en ajoutés ici.
  (function () {
    const ICON_COPY =
      '<svg class="icon-copy" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>';
    const ICON_CHECK =
      '<svg class="icon-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';

    const isEnglish = () => document.documentElement.lang === 'en';

    function fallbackCopy(text) {
      const area = document.createElement('textarea');
      area.value = text;
      area.setAttribute('readonly', '');
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(area);
      return ok ? Promise.resolve() : Promise.reject(new Error('copy failed'));
    }

    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
      }
      return fallbackCopy(text);
    }

    document.querySelectorAll('.install-body pre').forEach((pre) => {
      const code = pre.querySelector('code');
      if (!code) return;

      const wrapper = document.createElement('div');
      wrapper.className = 'code-block';
      pre.parentNode.insertBefore(wrapper, pre);
      wrapper.appendChild(pre);

      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'copy-btn';
      button.innerHTML =
        ICON_COPY + ICON_CHECK +
        '<span class="sr-only fr">Copier les commandes</span>' +
        '<span class="sr-only en">Copy commands</span>';
      button.addEventListener('mouseenter', () => {
        button.title = isEnglish() ? 'Copy' : 'Copier';
      });

      let resetTimer;
      button.addEventListener('click', () => {
        const text = code.innerText.replace(/\s+$/, '') + '\n';
        copyText(text).then(
          () => {
            button.dataset.feedback = isEnglish() ? 'Copied!' : 'Copié !';
            button.classList.add('copied');
          },
          () => {
            button.dataset.feedback = isEnglish() ? 'Copy failed' : 'Échec de la copie';
            button.classList.add('copy-error');
          }
        );
        clearTimeout(resetTimer);
        resetTimer = setTimeout(() => {
          button.classList.remove('copied', 'copy-error');
        }, 2000);
      });

      wrapper.appendChild(button);
    });
  })();
</script>
